[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yappr-server"
version = "0.1.0"
description = "TTS/STT inference server for Yappr (Kokoro hexgrad/Kokoro-82M + Whisper)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128.0",
  "uvicorn[standard]>=0.40.0",
  "requests>=2.32.3",
  "kokoro>=0.9.4",
  "soundfile>=0.13.0",
  "numpy>=1.26.0",
  "faster-whisper>=1.1.0",
  "python-multipart>=0.0.20",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
]

[project.scripts]
# `uv run check` → ruff + format + mypy + pytest (see checks.py).
check = "checks:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=0.25.0",
  "httpx>=0.28.0",
  "ruff>=0.15.0",
  "mypy>=1.15.0,<2",
]

[tool.setuptools]
# Only ship these modules; exclude one-off scripts (inspect_*, export_*, etc.).
# `checks` is included so the `check` console-script entry point resolves.
py-modules = ["server", "ports", "composition", "result", "config", "checks"]
packages = ["adapters"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = ["venv", ".venv", "__pycache__"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "ARG",    # flake8-unused-arguments
  "SIM",    # flake8-simplify
  "RUF",    # Ruff-specific rules
  "TC",     # flake8-type-checking (move type-only imports under TYPE_CHECKING)
  "RET",    # flake8-return
  "PIE",    # flake8-pie (misc lints)
  "PT",     # flake8-pytest-style
  "TRY",    # tryceratops (exception-handling antipatterns)
  "BLE",    # flake8-blind-except
  "DTZ",    # flake8-datetimez (tz-aware datetimes)
]
ignore = [
  "E501",     # line length handled by formatter
  "TRY003",   # allow long messages in raised exceptions
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["kokoro.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
